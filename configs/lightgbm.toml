[lightgbm]
version = "lgbm-infra-v1"
input_build_version = "m2-features-v1"
training_source = "normal_train"
seed = 202211
objective = "binary"
learning_rate = 0.05
num_boost_round = 300
min_data_in_leaf = 100
lambda_l1 = 0.0
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0
max_bin = 255
num_threads = 1
deterministic = true
force_col_wise = true
verbosity = -1

[benchmark]
feature_set = "fs3"
complexity = "shallow"
task = "long_view"
max_training_seconds = 900.0
max_peak_rss_mib = 12288.0

[complexity.shallow]
num_leaves = 31
max_depth = 6

[complexity.deep]
num_leaves = 127
max_depth = 10

[categorical_encoding]
missing_code = 0
unknown_code = 1
known_code_offset = 2
vocabulary_source = "authorized_normal_training_only"
string_policy = "whole_value_no_expansion"
tag_set_policy = "whole_canonical_tag_set_no_expansion"

[tasks.long_view]
label = "long_view"
mask = "all"

[tasks.like]
label = "is_like"
mask = "all"

[tasks.valid_play]
label = "is_click"
mask = "click_semantics == valid_play"

[tasks.literal_click]
label = "is_click"
mask = "click_semantics == literal_click"
