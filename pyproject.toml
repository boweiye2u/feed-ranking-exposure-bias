[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuairand-pure"
version = "0.0.0"
description = "Feed ranking under exposure bias on KuaiRand-Pure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "polars>=0.20",
  "pyarrow>=14",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "lightgbm>=4.1",
  "torch>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
kuairand-init-artifacts = "kuairand_pure.paths:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
